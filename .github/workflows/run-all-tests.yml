name: Running all tests

on:
  push:
    branches:
      - main
    paths:
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'

  workflow_dispatch:

jobs:
  all_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment variables
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          python -c "import os; print('BASE_URL:', bool(os.getenv('BASE_URL')))"
          python -c "import os; print('USERNAME:', bool(os.getenv('BOOKER_USERNAME')))"
          python -c "import os; print('PASSWORD:', bool(os.getenv('BOOKER_PASSWORD')))"
      - name: Running all tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
        run: pytest -v
