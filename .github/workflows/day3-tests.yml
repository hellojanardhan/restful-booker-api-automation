
name: Day 3 - Smoke and Regression Tests

on:
  push:
    branches: [main]

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [main]

  workflow_dispatch:

jobs:
  smoke_tests:
    name: Smoke Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://restful-booker.herokuapp.com
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Smoke Tests
        run: pytest -m smoke -v

  regression_tests:
    name: Regression Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://restful-booker.herokuapp.com
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Regression Tests
        run: pytest -m regression -v
