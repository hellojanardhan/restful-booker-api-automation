name: Restful Booker - Full API Automation Pipeline

on:
  workflow_dispatch:

jobs:
  api_tests:
    name: API Automation
    runs-on: ubuntu-latest
    environment: QA
    timeout-minutes: 20

    env:
      BASE_URL: ${{ vars.BASE_URL }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

    steps:

      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Install Allure CLI
      - name: Install Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          sudo npm install -g allure-commandline

      # Step 5: Verify Configuration
      - name: Verify Configuration
        run: |
          python --version
          pip --version
          allure --version

          python -c "import os; assert os.getenv('BASE_URL'), 'BASE_URL is missing'; assert os.getenv('BOOKER_USERNAME'), 'BOOKER_USERNAME is missing'; assert os.getenv('BOOKER_PASSWORD'), 'BOOKER_PASSWORD is missing'; print('Required environment variables are configured')"

      # Step 6: Run API Tests and Generate Reports
      - name: Run API Tests
        run: |
          mkdir -p reports
          pytest -v \
            --alluredir=reports/allure-results \
            --html=reports/report.html \
            --self-contained-html

      # Step 7: Verify Pytest HTML Report
      - name: Verify Pytest HTML Report
        if: always()
        run: |
          if [ -f reports/report.html ]; then
            echo "Pytest HTML report generated successfully"
            ls -lh reports/report.html
          else
            echo "Pytest HTML report not found"
          fi

      # Step 8: Verify Allure HTML Report
      - name: Verify Allure HTML Report
        if: always()
        run: |
          if [ -f reports/allure-report/index.html ]; then
            echo "Allure HTML report generated successfully"
            ls -lh reports/allure-report/index.html
          else
            echo "Allure HTML report not found"
          fi

      # Step 9: Upload Test Reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Automation-Test-Reports
          path: |
            reports/report.html
            reports/allure-report/
          retention-days: 7
          if-no-files-found: warn
