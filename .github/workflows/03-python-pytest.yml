name: Python Pytest CI Pipeline
on:
    push:
        branches:
            - main
        paths:
            - 'tests/**'
            - 'pytest.ini'
            - 'requirements.txt'
            - '.github/workflows/03-python-pytest.yml'
        
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
        paths:
            - 'tests/**'
            - 'pytest.ini'
            - 'requirements.txt'
            - '.github/workflows/03-python-pytest.yml'
        branches:
            - main

    workflow_dispatch:

jobs:
    pytest_tests:
        env:
            BASE_URL: ${{secrets.BASE_URL}}
            BOOKER_USERNAME: ${{secrets.BOOKER_USERNAME}}
            BOOKER_PASSWORD: ${{secrets.BOOKER_PASSWORD}}
        name: Using Ubuntu Latest GitHub-hosted Runner

        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
        
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            
            - name: Install dependencies
              run: |
                    pip install --upgrade pip
                    pip install -r requirements.txt
            
            - name: Run tests
              run: pytest -v
        
