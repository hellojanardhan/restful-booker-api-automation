name: Python Version Matrix API Tests

on:
  workflow_dispatch:

jobs:
  matrix_tests:
    name: Running API Tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    environment: QA
    timeout-minutes: 20
    env:
      BASE_URL: ${{ vars.BASE_URL || secrets.BASE_URL }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run API Tests
        run: |
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
          pytest -v --alluredir=reports/allure-results --html=reports/report.html --self-contained-html
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: API-Reports-Python-${{ matrix.python-version }}
          path: |
            reports/report.html
            reports/allure-results/
          retention-days: 7
          if-no-files-found: warn
