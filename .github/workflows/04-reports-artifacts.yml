
# Workflow name
name: Pytest HTML Reports and Artifacts Pipeline

# Configure workflow event triggers
on:
  # Trigger when code is pushed to main
  push:
    branches:
      - main
    paths:
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/04-reports-artifacts.yml'

  # Trigger when a pull request targets main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - 'tests/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/04-reports-artifacts.yml'

  # Allow manual workflow execution
  workflow_dispatch:

# Configure jobs
jobs:
  reports_artifacts:
    name: Host is Ubuntu
    runs-on: ubuntu-latest

    # Configure environment variables using GitHub Secrets
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

    steps:

      # Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Configure Python 3.12
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Upgrade pip and install project dependencies
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Execute pytest and generate an HTML report
      - name: Run Tests
        run: |
          mkdir -p reports
          pytest -v --html=reports/report.html --self-contained-html

      # Upload the generated HTML report as a GitHub Actions artifact
      # Run this step even if the test execution fails
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-html-report
          path: reports/report.html
          retention-days: 10

      # Download the uploaded artifact from the same workflow run
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        if: always()
        with:
          name: pytest-html-report
          path: downloaded-artifacts

      # Verify that the downloaded HTML report exists and is not empty
      - name: Verify Downloaded Report
        # Run this step even if a previous step fails
        if: always()
        run: |
          # Check whether the downloaded report exists and contains data
          if [ -s downloaded-artifacts/report.html ]; then

            # Print success message
            echo "SUCCESS: HTML report downloaded successfully"

            # Display the downloaded report file size
            ls -lh downloaded-artifacts/report.html

          else
            # Print error message if the report is missing or empty
            echo "ERROR: HTML report not found or empty"

            # Fail the workflow
            exit 1
          fi
