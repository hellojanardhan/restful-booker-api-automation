[pytest]

addopts =
    -v
    --capture=tee-sys
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results

log_level = INFO

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    booking_by_id: Tests for GET /booking/{id}
    functional: Positive endpoint behavior
    negative: Invalid or nonexistent input behavior
    security: Authentication and header security behavior
    schema: Response structure validation
    order: Explicit test execution order
    authentication: Authentication endpoint tests
    authorization: Authorized booking operation tests
    create_booking: Booking creation tests
    booking_collection: Booking collection tests
    ping: Ping endpoint tests
    smoke: Critical smoke tests
    regression: Full regression coverage
    partial_update: Partial booking update tests
    update_booking: Full booking update tests
    delete_booking: Booking deletion tests
    e2e: End-to-end booking lifecycle tests